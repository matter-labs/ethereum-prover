name: Build reproducible guest
description: Build the Fusaka distribution on the host Docker daemon before image/test packaging.
runs:
  using: composite
  steps:
    - name: Install guest tool dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
    - name: Install Rust toolchain
      uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
      with:
        inherit-toolchain: true
        cache: false
    - name: Build reproducible Fusaka guest
      shell: bash
      env:
        RUST_MIN_STACK: 1073741824
      run: |
        cargo install --path ../airbender-platform/crates/cargo-airbender --no-default-features --locked
        scripts/rebuild_artifacts.sh --guest-only
