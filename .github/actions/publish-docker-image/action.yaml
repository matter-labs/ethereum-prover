name: 'Publish Docker Image'

description: 'Build and publish a Docker image to GitHub Container Registry with shared metadata and caching.'

inputs:
  image_name:
    description: 'Image name without the ghcr.io/<owner>/ prefix.'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile.'
    required: true
  tag:
    description: 'Optional explicit image tag.'
    required: false
    default: ''
  publish_latest:
    description: 'Whether to publish the latest tag.'
    required: false
    default: 'false'
  publish_sha_tag:
    description: 'Whether to publish a moving short-SHA tag.'
    required: false
    default: 'false'
  registry_username:
    description: 'Username for the target registry.'
    required: true
  registry_password:
    description: 'Password or token for the target registry.'
    required: true
  build_args:
    description: 'Optional multiline build args passed to docker/build-push-action.'
    required: false
    default: ''
  platforms:
    description: 'Comma-separated target platforms.'
    required: false
    default: 'linux/amd64'
  push:
    description: 'Whether to push the image.'
    required: false
    default: 'true'
  load:
    description: 'Whether to load the image into the local Docker daemon.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Assemble tag rules
      id: tags
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag }}
        PUBLISH_LATEST: ${{ inputs.publish_latest }}
        PUBLISH_SHA_TAG: ${{ inputs.publish_sha_tag }}
      run: |
        TAG_RULES_FILE="$(mktemp)"

        if [[ -n "${IMAGE_TAG}" ]]; then
          echo "type=raw,value=${IMAGE_TAG}" >> "${TAG_RULES_FILE}"
        fi

        if [[ "${PUBLISH_LATEST}" == "true" ]]; then
          echo "type=raw,value=latest" >> "${TAG_RULES_FILE}"
        fi

        if [[ "${PUBLISH_SHA_TAG}" == "true" ]]; then
          echo "type=sha,format=short,prefix=,suffix=-{{date 'x'}}" >> "${TAG_RULES_FILE}"
        fi

        if [[ ! -s "${TAG_RULES_FILE}" ]]; then
          echo "At least one image tag rule must be configured."
          exit 1
        fi

        {
          echo "value<<EOF"
          cat "${TAG_RULES_FILE}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        DOCKER_METADATA_SHORT_SHA_LENGTH: 7
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
        tags: ${{ steps.tags.outputs.value }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build reproducible guest before docker build
      uses: ./.github/actions/build-reproducible-guest

    - name: Record source revisions
      id: stack
      shell: bash
      run: |
        echo "prover=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "zkos=$(git -C ../zksync-os rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "platform=$(git -C ../airbender-platform rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "airbender=$(git -C ../zksync-airbender rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "prover_dir=$(basename "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ github.workspace }}/..
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        build-args: |
          PROVER_DIR=${{ steps.stack.outputs.prover_dir }}
          PROVER_COMMIT=${{ steps.stack.outputs.prover }}
          ZKSYNC_OS_COMMIT=${{ steps.stack.outputs.zkos }}
          AIRBENDER_PLATFORM_COMMIT=${{ steps.stack.outputs.platform }}
          ZKSYNC_AIRBENDER_COMMIT=${{ steps.stack.outputs.airbender }}
          ${{ inputs.build_args }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:buildcache,mode=max
