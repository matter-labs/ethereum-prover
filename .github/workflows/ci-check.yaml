name: ci-run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVER_GPU_TESTS: prover-gpu-tests

jobs:
  # Release PRs only bump versions, the changelog and Cargo.lock, so they skip the
  # build and test jobs and check the lockfile instead.
  scope:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.scope.outputs.release }}
    steps:
      - id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${HEAD_REF}" == release-please--* || "${COMMIT_MESSAGE}" == "chore(main): release"* ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

  release-lockfile:
    name: release lockfile 🔒
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack
      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          inherit-toolchain: true
          cache: false
      - name: Cargo.lock matches the bumped versions
        run: cargo metadata --locked --format-version 1 > /dev/null

  general-checks:
    name: general-checks 🧹
    runs-on: matterlabs-ci-runner-high-performance
    needs: scope
    if: ${{ needs.scope.outputs.release != 'true' }}
    defaults:
      run:
        working-directory: ./proof_verifier_js/ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          inherit-toolchain: true

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: mskelton/setup-yarn@28f8f658e3991e4d2dd615e2370ec5da0bc64429 # v4.0.0

      - name: Install deps
        run: yarn install

      - name: Build
        run: yarn build

  license-check:
    name: license-check 📜
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./proof_verifier_js/ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Run license checker
        run: |
          license-checker --production \
            --onlyAllow "MIT;Apache-2.0" \
            --summary

  ethereum-prover-checks:
    name: ethereum-prover checks 🧪
    runs-on: matterlabs-ci-runner-high-performance
    needs: scope
    if: ${{ needs.scope.outputs.release != 'true' }}
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    env:
      CUDAARCHS: '80;89;90;120'
      RUST_MIN_STACK: 1073741824
    steps:
      - name: Install Git in the CUDA container
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Rustfmt
        run: cargo fmt -p ethereum_prover -- --check

      # TODO: For some reason, it takes forever to run.
      # - name: Clippy
      #   run: cargo clippy -p ethereum_prover --no-deps -- -D warnings

      - name: Tests (nextest)
        run: RUST_MIN_STACK=1073741824 cargo nextest run -p ethereum_prover --release

  build-reproducible-guest:
    runs-on: matterlabs-ci-runner-high-performance
    needs: scope
    if: ${{ needs.scope.outputs.release != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/checkout-stack
      - uses: ./.github/actions/build-reproducible-guest
      # upload-artifact rejects paths outside the workspace.
      - name: Stage the guest in the workspace
        run: mkdir -p ci-guest && cp -a ../zksync-os/zksync_os/dist/eth_stf/. ci-guest/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducible-guest
          path: ci-guest/
          if-no-files-found: error
          retention-days: 1

  ##########################################
  #  Build prover integration tests archive #
  ##########################################
  build-prover-tests:
    name: build prover tests 📦
    runs-on: matterlabs-ci-runner-high-performance
    needs: build-reproducible-guest
    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu26.04
    env:
      # The build container has no attached GPU, so the CUDA build must not rely
      # on `native` architecture detection. Keep this aligned with the GPU CI
      # runner fleet, following the working zksync-airbender setup.
      CUDAARCHS: '80;89;90;120'
      RUST_MIN_STACK: 1073741824
    steps:
      - name: Install Git in the CUDA container
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Check CUDA version
        run: nvcc --version

      - name: Download reproducible guest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducible-guest
          path: ci-guest

      - name: Place the guest in the zksync-os checkout
        run: mkdir -p ../zksync-os/zksync_os/dist/eth_stf && cp -a ci-guest/. ../zksync-os/zksync_os/dist/eth_stf/

      # The checkouts belong to the runner user, not the container's root, and the bundle
      # metadata reads their commits with git.
      - name: Mark the checkouts safe for git
        run: git config --global --add safe.directory '*'

      - name: Assemble the complete v3 bundle
        run: scripts/copy_artifacts.sh

      - name: Build and archive tests
        run: cargo nextest archive --release -p ethereum_prover --test integration --archive-file "${PROVER_GPU_TESTS}.tar.zst"

      - name: Upload tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROVER_GPU_TESTS }}
          path: |
            ${{ env.PROVER_GPU_TESTS }}.tar.zst
            artifacts/eth_stf/
          if-no-files-found: error
          retention-days: 1

  ######################################
  #  Run prover integration tests GPU  #
  ######################################
  ethereum-prover-gpu-tests:
    name: ethereum-prover gpu tests 🖥️
    runs-on: matterlabs-ci-gpu-runner
    container:
      image: nvidia/cuda:13.3.1-runtime-ubuntu26.04
      options: --gpus all
    needs: build-prover-tests
    steps:
      - name: Install Git in the CUDA container
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Download prebuilt tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROVER_GPU_TESTS }}
          path: .

      - name: Run prover tests on GPU
        env:
          RUN_GPU_TESTS: '1'
          FSV_DIR: ${{ github.workspace }}/../zksync-airbender/tools/gkr_verifier
          RUST_MIN_STACK: 1073741824
        run: cargo nextest run --archive-file "${PROVER_GPU_TESTS}.tar.zst" --workspace-remap "${GITHUB_WORKSPACE}"

  # Special job that allows some of the jobs to be skipped or failed
  # requiring others to be successful
  pr-checks:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - scope
      - release-lockfile
      - general-checks
      - ethereum-prover-checks
      - build-reproducible-guest
      - build-prover-tests
      - ethereum-prover-gpu-tests
    steps:
      - name: Decide on PR checks
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # One side is always skipped: the lockfile check on normal PRs, the rest on release PRs.
          allowed-skips: release-lockfile, general-checks, ethereum-prover-checks, build-reproducible-guest, build-prover-tests, ethereum-prover-gpu-tests
