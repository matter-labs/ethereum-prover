name: ci-run-release-please

# Give permissions to the release-please bot to open and update PRs
# and commit version updates across the shared release files
permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  issues: write

# Run the workflow on push to the main branch and manually
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Prepare the release PR with changelog updates and create github releases
  # Do not publish to crates.io or upgrade dependencies
  release-please:
    uses: matter-labs/zksync-ci-common/.github/workflows/release-please.yaml@371a7ddd803a87629005ceb682ae28e632ba366b # main 2026-10-02
    secrets:
      # Org-level secrets of the GitHub App used to mint installation tokens.
      # API commits are auto-signed.
      MATTERLABS_BOTS_APP_ID: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
      MATTERLABS_BOTS_PRIVATE_KEY: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
    with:
      config: '.github/release-please/config.json' # Specify the path to the configuration file
      manifest: '.github/release-please/manifest.json' # Specify the path to the manifest file
      upgrade-dependencies: false # Do not upgrade workspace dependencies
      # The shared job checks out only this repo; Cargo path dependencies need the v3 stack.
      update-cargo-lock: false
      publish-to-crates-io: false
      notify-slack: false

  # Same as the shared job, plus the v3 stack checkout that `cargo metadata` needs.
  update-cargo-lock:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    strategy:
      matrix:
        pr_branch: ${{ fromJson(needs.release-please.outputs.prs).*.headBranchName }}
      fail-fast: false
    steps:
      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.pr_branch }}
          token: ${{ steps.app_token.outputs.token }}
          submodules: recursive

      - name: Checkout v3 stack
        uses: ./.github/actions/checkout-stack

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          inherit-toolchain: true
          cache: false

      - name: Update Cargo.lock
        id: update
        run: |
          cargo update --workspace
          echo "changed=$(git diff --quiet && echo false || echo true)" >> "${GITHUB_OUTPUT}"

      # Commits through the GitHub API, so the commit is signed by GitHub.
      - name: Commit Cargo.lock changes
        if: ${{ steps.update.outputs.changed == 'true' }}
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: 'chore: update Cargo.lock'
          repo: ${{ github.repository }}
          branch: ${{ matrix.pr_branch }}
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

  # Publish the prover release artifacts (root package).
  release-artifacts:
    if: ${{ always() && fromJSON(needs.release-please.outputs.all).release_created == 'true' }}
    needs: release-please
    # Reusable workflows cannot elevate GITHUB_TOKEN permissions on their own.
    # Grant the scopes that ci-release.yaml needs to update releases, publish to
    # npm via OIDC, and push the prover image to GHCR.
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/ci-release.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      skip_npm_publish: true
      upload_prover_bundle: true
      push_docker_image: true
    secrets: inherit

  # Publish the verifier package to npm when its own component is released.
  # npm trusted publishing matches the calling workflow, so the trusted publisher
  # on npmjs.com must name this file (ci-release-please.yaml).
  publish-verifier:
    if: ${{ always() && fromJSON(needs.release-please.outputs.all)['proof_verifier_js--release_created'] == 'true' }}
    needs: release-please
    # ci-release.yaml's image job declares packages: write; callers must grant every
    # permission a called workflow requests, even for jobs that end up skipped.
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/ci-release.yaml
    with:
      tag: ${{ fromJSON(needs.release-please.outputs.all)['proof_verifier_js--tag_name'] }}
      skip_npm_publish: false
      upload_prover_bundle: false
      push_docker_image: false
    secrets: inherit
